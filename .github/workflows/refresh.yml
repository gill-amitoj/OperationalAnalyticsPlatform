name: Weekly data refresh

# Re-pulls the City of Edmonton datasets, re-runs cleaning, validation and KPIs,
# and commits updated extracts/reports only when the KPI data actually changed.
# BigQuery loading runs only when the GCP_SA_KEY secret is configured.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (07:00 Edmonton, MDT)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download even if the source is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}
      GCP_PROJECT_ID: ${{ secrets.GCP_SA_KEY != '' && vars.GCP_PROJECT_ID || '' }}
      BQ_DATASET: ${{ vars.BQ_DATASET || 'edmonton_traffic_safety' }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION || 'northamerica-northeast1' }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Test before touching data
        run: pytest -q

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run pipeline (ingest -> clean -> SQL -> extracts -> dashboard)
        run: python -m traffic_safety.pipeline ${{ inputs.force && '--force' || '' }}

      - name: Regenerate findings evidence
        run: python -m traffic_safety.findings

      - name: Keep raw snapshots as a build artifact (audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: raw-snapshots-${{ github.run_id }}
          path: data/raw/
          retention-days: 90

      - name: Commit only if KPI data changed
        run: |
          # tableau/ holds every KPI extract; reports and dashboard embed run timestamps, so they are not the signal.
          if git diff --quiet -- tableau/; then
            echo "Source data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tableau/ reports/ dashboard/
          git commit -m "Weekly data refresh: $(date -u +%Y-%m-%d)"
          git push
